name: Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      alert_email:
        description: Email address for the AWS Budget alert
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy CareerOS
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Validate repository
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Deploy infrastructure and frontend
        run: npm run deploy
        env:
          ALERT_EMAIL: ${{ inputs.alert_email }}
          # Team accounts the /admin page can exclude (comma-separated); kept out of the public repo.
          TEAM_EMAILS: ${{ secrets.TEAM_EMAILS }}
